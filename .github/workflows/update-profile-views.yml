name: Update profile views chart

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update profile views chart
        run: python scripts/update_profile_views.py

      - name: Commit chart updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update profile views chart"
          file_pattern: store/profile-views.json assets/profile-views-chart.png
